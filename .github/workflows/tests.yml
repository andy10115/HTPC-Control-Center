name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q src tests
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n bootstrap.sh install.sh uninstall.sh
      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(PYTHONPATH=src python -c 'from htpc_control_center import __version__; print(__version__)')
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}." >&2
            exit 1
          }

  gtk-navigation-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            xvfb
      - name: Click dashboard navigation actions
        env:
          PYTHONPATH: src
        run: xvfb-run -a python3 tests/ui_smoke.py
